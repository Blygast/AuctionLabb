name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:    # allow manual trigger for dry-runs

permissions:
  contents: write        # required to create a GitHub Release

jobs:
  release:
    name: Build + publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # Backend
      # ------------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        # Populates obj/project.assets.json so the --no-restore test can run.
        # The Setup .NET step only caches ~/.nuget/packages, not obj/.
        run: dotnet restore AuctionApi.slnx

      - name: Test backend
        working-directory: api
        run: dotnet test AuctionApi.slnx --nologo --no-restore -c Release --filter "Category!=Integration"
        # Category!=Integration skips the LocalDB-backed tests because the
        # ubuntu-latest runner has no LocalDB. Integration tests run on
        # every push to master in test.yml's windows-latest job, so the
        # code is already validated by the time we cut a release.
        

      - name: Publish backend
        working-directory: api
        run: >
          dotnet publish AuctionApi/AuctionApi.csproj
          -c Release
          -o ../release/api
          /p:UseAppHost=false

      # ------------------------------------------------------------------
      # Frontend
      # ------------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Test frontend
        working-directory: client
        run: |
          npm ci
          npm run build
          npm run lint

      # ------------------------------------------------------------------
      # Bundle
      # ------------------------------------------------------------------
      - name: Copy frontend build
        run: cp -r client/dist release/client

      - name: Zip artifacts
        run: |
          cd release
          zip -r ../auctionlabb-${{ github.ref_name }}.zip .
          cd ..
          ls -lh auctionlabb-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            auctionlabb-${{ github.ref_name }}.zip
          body: |
            ## Production build — ${{ github.ref_name }}

            | Artifact | Contents |
            |---|---|
            | `release/api/` | Self-contained ASP.NET Core 10 publish (runs with `dotnet AuctionApi.dll`) |
            | `release/client/` | Static Vite build (deploy to any static host, or use the API container's static file serving) |
            | `auctionlabb-*.zip` | Everything above, bundled |

            ### Quick start

            ```bash
            # Run the API
            dotnet release/api/AuctionApi.dll

            # Serve the client (separate host, or skip if you embedded it in the API image)
            npx serve release/client
            ```

            Or just `docker run -p 8080:8080 ghcr.io/${{ github.repository_owner }}/auctionlabb:${{ github.ref_name }}`
            once the image is published.
