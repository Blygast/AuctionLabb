name: Pages

# Deploy the committed docs/coverage/ HTML to GitHub Pages on every push to
# main. The coverage itself is regenerated by coverage.yml; this workflow
# just publishes whatever is in the repo at the time.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# The deploy job needs Pages write + an OIDC token to publish to the
# github-pages environment. Other jobs only need read access.
permissions:
  contents: read

# Don't fight the test job — Pages can run alongside it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy coverage site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # `enablement: true` lets the action auto-enable GitHub Pages on the
      # repo on the first run. Without it, the action tries to GET the
      # existing site config, gets 404 (because Pages isn't enabled), and
      # the workflow fails.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs/coverage as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/coverage
          # Serve index.html at the root of the Pages site (so the URL is
          # https://<owner>.github.io/<repo>/, not .../index.html).
          retention-days: 7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
