name: Pages

# Deploy the committed docs/coverage/ HTML to GitHub Pages on every push to
# main. The coverage itself is regenerated by coverage.yml; this workflow
# just publishes whatever is in the repo at the time.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# The deploy job needs Pages write + an OIDC token to publish to the
# github-pages environment. Other jobs only need read access.
permissions:
  contents: read

# Don't fight the test job — Pages can run alongside it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy coverage site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ===========================================================================
      # ONE-TIME MANUAL SETUP REQUIRED:
      #   1. Go to https://github.com/<owner>/<repo>/settings/pages
      #   2. Under "Build and deployment" choose Source = "GitHub Actions"
      #   3. Click Save
      #
      # Why we can't auto-enable: `enablement: true` on this action tries to
      # call the GitHub REST API to create the Pages site, but the default
      # GITHUB_TOKEN has `pages: write` only — that's enough to DEPLOY to an
      # already-enabled Pages site, but not enough to flip the feature on
      # for the first time. The API returns "Resource not accessible by
      # integration" (HTTP 403). After the one-time manual enable, this
      # workflow works on every push with no further setup.
      #
      # We do NOT set `enablement: true` here because it would fail with
      # the same 403. The action still needs to run so the github-pages
      # environment gets set up (and so the deployment URL is known).
      # ===========================================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/coverage as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/coverage
          # Serve index.html at the root of the Pages site (so the URL is
          # https://<owner>.github.io/<repo>/, not .../index.html).
          retention-days: 7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
